name: Integration Test - CARE Server

# End-to-end test of the DICOM Enabler services built from this commit, against a real CARE
# server and a dedicated test facility. The suite (ci/integration) acts as the modality:
#
#   Environment   configured ports/AE titles honoured, C-ECHO, wrong AE / SOP class rejected,
#                 calling AE outside the Server List rejected by MWL and Store SCP,
#                 CARE login, facility, patient, status tags, imaging activity definitions
#   SRs           service requests created from the facility's imaging activity definitions,
#                 accession numbers assigned by care_radiology
#   Worklist      C-FIND returns exactly the SRs that target the configured device
#   MPPS          N-CREATE / N-SET: started -> completed, started -> discontinued, and refused
#                 transitions; status read back from CARE
#   Files         small and large DICOM: C-STORE -> Store SCP -> Store SCU upload -> linked to SR;
#                 malformed dataset, non-DICOM file and non-DICOM upload rejected
#
# Every test captures the slice of each service log written while it ran. The run publishes
# report.html (per-test details, CARE API calls, logs), results.json, JUnit XML and a summary
# on the job page with the service request IDs, accession numbers and UIDs involved.
#
# -- Pointing it at an instance / facility / user ------------------------------------------
# Settings come from a GitHub Environment (Settings > Environments), so one workflow serves any
# number of targets: create one environment per CARE instance or facility and pick it when
# running. A workflow_dispatch input, when given, overrides the environment variable.
#
#   Secrets (required)
#     CARE_API_TOKEN     care_radiology static key (CARE_RADIOLOGY_WEBHOOK_SECRET)
#     CARE_USERNAME      test user - facility admin of the test facility, no MFA
#     CARE_PASSWORD
#   Variables (required)
#     CARE_BASE_URL      e.g. https://care.example.org   (may also be a secret)
#     CARE_FACILITY_ID   dedicated test facility UUID
#     CARE_PATIENT_ID    test patient UUID in that facility
#   Variables (optional)
#     CARE_ENCOUNTER_ID          reuse this encounter (default: patient's in-progress one, or new)
#     CARE_MODALITY              device registered_name the enabler serves (default CT)
#     CARE_ACTIVITY_DEFINITIONS  comma-separated AD slugs to use (default: all active imaging ADs)
#     CARE_SERVER_TIMEZONE       Windows time zone of the CARE server (default India Standard Time)
#     MPPS_STATUS_STARTED / MPPS_STATUS_COMPLETED / MPPS_STATUS_DISCONTINUED
#                                tag displays (default Scan Started / Scan Completed / Scan Cancelled)
#     MWL_PORT / STORE_PORT      ports to configure (default 11108 / 11107 - deliberately not the
#                                2008 / 2007 defaults, so the test proves the config is honoured)
#     LARGE_FILE_MB              size of the large-file test (default 40)
#
# The facility must already have: an imaging activity definition whose location holds a device
# registered as CARE_MODALITY, ideally a second imaging AD without one (for the negative worklist
# check), and service_request tag configs named as the MPPS_STATUS_* values.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment holding the target CARE settings'
        required: false
        default: 'staging'
        type: string
      care_base_url:
        description: 'Override CARE_BASE_URL'
        required: false
        type: string
      care_facility_id:
        description: 'Override CARE_FACILITY_ID'
        required: false
        type: string
      care_patient_id:
        description: 'Override CARE_PATIENT_ID'
        required: false
        type: string
      care_modality:
        description: 'Override CARE_MODALITY (device registered_name)'
        required: false
        type: string
      care_activity_definitions:
        description: 'Override CARE_ACTIVITY_DEFINITIONS (comma-separated slugs)'
        required: false
        type: string
      large_file_mb:
        description: 'Override LARGE_FILE_MB'
        required: false
        type: string
      keep_service_requests:
        description: 'Leave the created service requests active (default: revoke them at the end)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 2 * * *'  # daily, against the default environment
  push:
    branches: [main]
    paths:
      - 'CARE*/**'
      - 'ci/integration/**'
      - 'Emulator/schema.sql'
      - 'Emulator/care_tables.sql'
      - '.github/workflows/integration-test-staging.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CARE*/**'
      - 'ci/integration/**'
      - 'Emulator/schema.sql'
      - 'Emulator/care_tables.sql'
      - '.github/workflows/integration-test-staging.yml'

# Runs share the test facility, and the worklist test expects only its own service requests, so
# never run two against the same environment at once.
concurrency:
  group: dicom-enabler-integration-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  integration:
    # Pull requests from forks get no secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'staging' }}

    # Read through env, never inline ${{ }} in scripts: keeps secret masking and avoids injection.
    env:
      CARE_BASE_URL:             ${{ inputs.care_base_url || vars.CARE_BASE_URL || secrets.CARE_BASE_URL }}
      CARE_API_TOKEN:            ${{ secrets.CARE_API_TOKEN }}
      CARE_USERNAME:             ${{ secrets.CARE_USERNAME }}
      CARE_PASSWORD:             ${{ secrets.CARE_PASSWORD }}
      CARE_FACILITY_ID:          ${{ inputs.care_facility_id || vars.CARE_FACILITY_ID }}
      CARE_PATIENT_ID:           ${{ inputs.care_patient_id || vars.CARE_PATIENT_ID }}
      CARE_ENCOUNTER_ID:         ${{ vars.CARE_ENCOUNTER_ID }}
      CARE_MODALITY:             ${{ inputs.care_modality || vars.CARE_MODALITY || 'CT' }}
      CARE_ACTIVITY_DEFINITIONS: ${{ inputs.care_activity_definitions || vars.CARE_ACTIVITY_DEFINITIONS }}
      CARE_SERVER_TIMEZONE:      ${{ vars.CARE_SERVER_TIMEZONE || 'India Standard Time' }}
      MPPS_STATUS_STARTED:       ${{ vars.MPPS_STATUS_STARTED || 'Scan Started' }}
      MPPS_STATUS_COMPLETED:     ${{ vars.MPPS_STATUS_COMPLETED || 'Scan Completed' }}
      MPPS_STATUS_DISCONTINUED:  ${{ vars.MPPS_STATUS_DISCONTINUED || 'Scan Cancelled' }}
      MWL_PORT:                  ${{ vars.MWL_PORT || '11108' }}
      STORE_PORT:                ${{ vars.STORE_PORT || '11107' }}
      MWL_AET:                   MODALITYSCP
      STORE_AET:                 STORAGESCP
      CALLING_AET:               CARECITEST
      LARGE_FILE_MB:             ${{ inputs.large_file_mb || vars.LARGE_FILE_MB || '40' }}
      CLEANUP_SERVICE_REQUESTS:  ${{ inputs.keep_service_requests && 'false' || 'true' }}
      ENABLER_DIR:               ${{ github.workspace }}\bin\Release
      REPORT_DIR:                ${{ github.workspace }}\test-results
      SERVICES:                  CAREMWLci CAREStoreSCPci CARESCUci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check target configuration
        shell: pwsh
        run: |
          $required = 'CARE_BASE_URL','CARE_API_TOKEN','CARE_USERNAME','CARE_PASSWORD','CARE_FACILITY_ID','CARE_PATIENT_ID'
          $missing = $required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Error "Environment '${{ inputs.environment || 'staging' }}' is missing: $($missing -join ', '). See the header of this workflow."
            exit 1
          }
          Write-Output "Target       : $env:CARE_BASE_URL"
          Write-Output "Facility     : $env:CARE_FACILITY_ID"
          Write-Output "Patient      : $env:CARE_PATIENT_ID"
          Write-Output "Modality     : $env:CARE_MODALITY"
          Write-Output "MPPS statuses: $env:MPPS_STATUS_STARTED / $env:MPPS_STATUS_COMPLETED / $env:MPPS_STATUS_DISCONTINUED"
          Write-Output "Ports        : MWL $env:MWL_PORT, Store $env:STORE_PORT"

      # CARE compares the worklist from/to (naive timestamps the MWL service sends from the
      # runner's clock) in the server's time zone, so the runner must use the same one.
      - name: Match the CARE server time zone
        shell: pwsh
        run: |
          tzutil /s "$env:CARE_SERVER_TIMEZONE"
          if ($LASTEXITCODE -ne 0) { Write-Error "Unknown Windows time zone '$env:CARE_SERVER_TIMEZONE'"; exit 1 }
          # .NET caches the local zone at process start; without this Get-Date still returns UTC.
          [System.TimeZoneInfo]::ClearCachedData()
          # Only service requests created from now on belong to this run.
          $from = (Get-Date).AddMinutes(-1).ToString('yyyy-MM-dd HH:mm:ss')
          echo "CARE_FROM_DATE=$from" >> $env:GITHUB_ENV
          Write-Output "Time zone $(tzutil /g); worklist from $from"

      - name: Configure services for the target
        shell: pwsh
        run: |
          function Set-AppSettings([string]$path, [hashtable]$settings) {
            [xml]$xml = Get-Content $path
            foreach ($key in $settings.Keys) {
              $node = $xml.configuration.appSettings.add | Where-Object key -eq $key
              if (-not $node) {
                $node = $xml.CreateElement('add'); $node.SetAttribute('key', $key)
                [void]$xml.configuration.appSettings.AppendChild($node)
              }
              $node.SetAttribute('value', $settings[$key])
            }
            $xml.Save((Resolve-Path $path).Path)
            Write-Output "Patched $path ($($settings.Count) settings)"
          }

          # Worklist fetch + MPPS status webhook
          Set-AppSettings "CARE_MWL_Service\App.config" @{
            backend                = '2'
            eventlog               = 'false'
            careBaseUrl            = $env:CARE_BASE_URL
            careToken              = $env:CARE_API_TOKEN
            careModality           = $env:CARE_MODALITY
            careFromDate           = $env:CARE_FROM_DATE
            careScheduledAET       = $env:CALLING_AET
            mppsStatusStarted      = $env:MPPS_STATUS_STARTED
            mppsStatusCompleted    = $env:MPPS_STATUS_COMPLETED
            mppsStatusDiscontinued = $env:MPPS_STATUS_DISCONTINUED
          }
          # DICOM upload + study webhook
          Set-AppSettings "CARE_SCU_Service\App.config" @{
            eventlog       = 'false'
            careBackendURL = $env:CARE_BASE_URL
            staticAPIKey   = $env:CARE_API_TOKEN
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build services
        shell: pwsh
        run: |
          nuget restore CARE_DICOM_Enabler.sln
          if ($LASTEXITCODE -ne 0) { Write-Error "NuGet restore failed"; exit 1 }
          foreach ($proj in 'CARE.DAL\CARE.Common.csproj','CARE_MWL_Service\CARE_MWL_Service.csproj',
                            'CARE_StoreSCP_Service\CARE_StoreSCP_Service.csproj','CARE_SCU_Service\CARE_SCU_Service.csproj') {
            msbuild $proj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal
            if ($LASTEXITCODE -ne 0) { Write-Error "$proj build failed"; exit 1 }
          }
          foreach ($exe in 'CARE_MWL_Service','CARE_StoreSCP_Service','CARE_SCU_Service') {
            if (-not (Test-Path "bin\Release\$exe.exe")) { Write-Error "bin\Release\$exe.exe missing"; exit 1 }
          }

      - name: Start MySQL
        shell: pwsh
        run: |
          $svcName = @("MySQL80", "MySQL84", "MySQL") |
            Where-Object { Get-Service $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $svcName) {
            choco install mysql --yes --no-progress --timeout 300
            $svcName = @("MySQL80", "MySQL84", "MySQL") |
              Where-Object { Get-Service $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
            if (-not $svcName) { Write-Error "MySQL service not found after Chocolatey install"; exit 1 }
          }
          Start-Service $svcName -ErrorAction SilentlyContinue

          $mysql = @("C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe",
                     "C:\Program Files\MySQL\MySQL Server 8.4\bin\mysql.exe",
                     "C:\tools\mysql\current\bin\mysql.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mysql) { $mysql = (Get-Command mysql -ErrorAction SilentlyContinue)?.Source }
          if (-not $mysql) { Write-Error "mysql.exe not found"; exit 1 }
          echo "MYSQL_EXE=$mysql" >> $env:GITHUB_ENV

          for ($i = 1; $i -le 30; $i++) {
            & $mysql -u root --protocol=TCP -e "SELECT 1;" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Output "MySQL ready"; exit 0 }
            Start-Sleep -Seconds 3
          }
          Write-Error "MySQL did not become ready"; exit 1

      # The full enabler schema (tables + stored procedures the services call), then the CARE
      # tables (care_config etc.), in the same order as Initializer.ps1. schema.sql's ALTER USER
      # line sets a root password for desktop installs; the CI root keeps an empty one.
      - name: Create database and register the calling modality
        shell: pwsh
        run: |
          (Get-Content "Emulator\schema.sql") |
            Where-Object { $_ -notmatch '^\s*(ALTER USER|FLUSH PRIVILEGES)' } |
            & $env:MYSQL_EXE -u root --protocol=TCP
          if ($LASTEXITCODE -ne 0) { Write-Error "Schema creation failed"; exit 1 }

          Get-Content "Emulator\care_tables.sql" | & $env:MYSQL_EXE -u root --protocol=TCP
          if ($LASTEXITCODE -ne 0) { Write-Error "CARE tables creation failed"; exit 1 }

          # Server List row: with checkserver=true in cfg/common.cfg, the only AE/IP the MWL and
          # Store SCP accept.
          $sql = "INSERT INTO plexus_mi2.dcm_servers (name, aetitle, hostaddress, portnumber, description) " +
                 "VALUES ('CI modality', '$env:CALLING_AET', '127.0.0.1', '104', 'GitHub Actions integration test');"
          & $env:MYSQL_EXE -u root --protocol=TCP -e $sql
          if ($LASTEXITCODE -ne 0) { Write-Error "Server List insert failed"; exit 1 }
          Write-Output "Registered $env:CALLING_AET"

          # Configuration tab settings. The MWL service and the SCU service (which refreshes the
          # worklist when an upload's accession number is unknown) both read these, falling back to
          # their own App.config when blank, so set them here once for both.
          $settings = [ordered]@{
            facility_id    = $env:CARE_FACILITY_ID
            care_modality  = $env:CARE_MODALITY
            care_from_date = $env:CARE_FROM_DATE
          }
          foreach ($key in $settings.Keys) {
            $sql = "UPDATE plexus_mi2.care_config SET config_value = '$($settings[$key])' WHERE config_key = '$key';"
            & $env:MYSQL_EXE -u root --protocol=TCP -e $sql
            if ($LASTEXITCODE -ne 0) { Write-Error "care_config $key update failed"; exit 1 }
            Write-Output "care_config $key = $($settings[$key])"
          }

      # Replicates CARE.DAL/EnDcryption.cs: AES-256-CBC, key = EncKey.encdeKey, zero IV, PKCS7.
      - name: Write cfg/common.cfg
        shell: pwsh
        run: |
          $aes = [Security.Cryptography.Aes]::Create()
          $aes.Key = [Text.Encoding]::UTF8.GetBytes("3DEA271411CD4AA0AC1499ACF35B0A9E")
          $aes.IV  = New-Object byte[] 16
          $ms = New-Object IO.MemoryStream
          $cs = New-Object Security.Cryptography.CryptoStream($ms, $aes.CreateEncryptor(), [Security.Cryptography.CryptoStreamMode]::Write)
          $sw = New-Object IO.StreamWriter($cs)
          $sw.Write("Server=localhost;Database=plexus_mi2;Uid=root;Pwd=;"); $sw.Close(); $cs.Close()
          $conn = [Convert]::ToBase64String($ms.ToArray())

          $cfg = '<?xml version="1.0" encoding="utf-8"?><configurations>' +
                 "<connectString>$conn</connectString>" +
                 "<mwlaetitle>$env:MWL_AET</mwlaetitle><mwlport>$env:MWL_PORT</mwlport>" +
                 "<sscpaetitle>$env:STORE_AET</sscpaetitle><sscpport>$env:STORE_PORT</sscpport>" +
                 "<sscuaetitle>STORAGESCU</sscuaetitle><sscuhost>127.0.0.1</sscuhost>" +
                 "<callingaetitle>STORAGESCU</callingaetitle><sscuport>$env:STORE_PORT</sscuport>" +
                 "<checkserver>true</checkserver></configurations>"
          New-Item -ItemType Directory -Force -Path "bin\Release\cfg", "bin\Release\SCP", "bin\Release\logs" | Out-Null
          Set-Content -Path "bin\Release\cfg\common.cfg" -Value $cfg
          Write-Output "cfg/common.cfg: MWL $env:MWL_AET@$env:MWL_PORT, Store $env:STORE_AET@$env:STORE_PORT"

      - name: Install and start services
        shell: pwsh
        run: |
          $exes = @{ CAREMWLci = 'CARE_MWL_Service'; CAREStoreSCPci = 'CARE_StoreSCP_Service'; CARESCUci = 'CARE_SCU_Service' }
          foreach ($svc in $env:SERVICES -split ' ') {
            $path = (Resolve-Path "bin\Release\$($exes[$svc]).exe").Path
            New-Service -Name $svc -BinaryPathName "`"$path`"" -StartupType Manual -ErrorAction Stop | Out-Null
            Start-Service $svc -ErrorAction Stop
            Write-Output "$svc : $((Get-Service $svc).Status)"
          }
          foreach ($port in $env:MWL_PORT, $env:STORE_PORT) {
            $up = $false
            for ($i = 1; $i -le 30 -and -not $up; $i++) {
              $up = (Test-NetConnection 127.0.0.1 -Port $port -WarningAction SilentlyContinue).TcpTestSucceeded
              if (-not $up) { Start-Sleep -Seconds 2 }
            }
            if (-not $up) { Write-Error "Nothing listening on port $port after 60s"; Get-ChildItem bin\Release\logs -Recurse -File -Filter *.txt | ForEach-Object { Get-Content $_.FullName -Tail 30 }; exit 1 }
            Write-Output "Port $port listening"
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/integration/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r ci/integration/requirements.txt

      - name: Run integration suite
        id: suite
        continue-on-error: true
        working-directory: ci/integration
        run: python -m pytest -v --junitxml="$env:REPORT_DIR\junit.xml"

      - name: Build report
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:REPORT_DIR\results.json")) { Write-Warning "No results.json - the suite did not run"; exit 0 }
          python ci/integration/report.py "$env:REPORT_DIR"
          Get-Content "$env:REPORT_DIR\summary.md" -Raw >> $env:GITHUB_STEP_SUMMARY

      - name: Stop services and collect logs
        if: always()
        shell: pwsh
        run: |
          foreach ($svc in $env:SERVICES -split ' ') {
            Stop-Service $svc -Force -ErrorAction SilentlyContinue
            Remove-Service $svc -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Force -Path "$env:REPORT_DIR\service-logs" | Out-Null
          # Services log to logs\yyyy-MM-dd\ (rolled files zipped under its archive\)
          Copy-Item "bin\Release\logs\*" "$env:REPORT_DIR\service-logs" -Recurse -ErrorAction SilentlyContinue
          # Defence in depth: the suite already redacts results.json; scrub the copied logs too.
          foreach ($file in Get-ChildItem "$env:REPORT_DIR" -Recurse -File -Include *.txt, *.html, *.md, *.xml) {
            $text = Get-Content $file.FullName -Raw
            if ($text) {
              foreach ($secret in $env:CARE_API_TOKEN, $env:CARE_PASSWORD) {
                if ($secret) { $text = $text.Replace($secret, '***') }
              }
              Set-Content -Path $file.FullName -Value $text -NoNewline
            }
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dicom-enabler-integration-${{ inputs.environment || 'staging' }}-${{ github.run_number }}
          path: test-results/
          if-no-files-found: warn

      - name: Fail the job if any test failed
        if: steps.suite.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Integration tests failed - see the job summary and report.html in the artifact"
          exit 1
