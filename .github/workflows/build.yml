name: Build CARE DICOM Enabler

# Configurable Parameters (when triggered manually):
#   Build Settings:
#     - Build Configuration (Release/Debug)
#     - Platform (Any CPU, x86, x64)
#     - Parallel Build (enable/disable /m flag)
#     - Include Artifact Upload (yes/no)
#   CARE Server Settings (baked into EXE):
#     - CARE Server URL
#     - CARE API Token
#     - DICOM Modality Filter
#     - Worklist From Date
#
# CARE settings resolve in this order (first non-empty wins):
#   1. workflow_dispatch input   - one-off override for a manual run
#   2. repository secret / var   - the standing default
#   3. App.config committed value
#
# Configure the standing defaults once under
# Settings > Secrets and variables > Actions.
#
#   Secrets tab (masked in logs):
#     CARE_BASE_URL    e.g. https://care.example.org
#     CARE_API_TOKEN   the radiology plugin API token
#
#   Variables tab (appear in the artifact filename, so not secrets):
#     CARE_MODALITY    optional, e.g. CT   (leave unset for all modalities)
#     CARE_FROM_DATE   optional, e.g. 2025-01-01 08:00:00
#     CARE_BACKEND     optional, 0=List 1=Database 2=CARE Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger with configurable inputs
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      build_platform:
        description: 'Build Platform'
        required: false
        default: 'Any CPU'
        type: choice
        options:
          - Any CPU
          - x86
          - x64
      parallel_build:
        description: 'Enable Parallel Build (/m flag)'
        required: false
        default: true
        type: boolean
      upload_artifact:
        description: 'Upload Build Artifact'
        required: false
        default: true
        type: boolean
      care_server_url:
        description: 'CARE Server URL (baked into EXE)'
        required: false
        default: ''
        type: string
      care_api_token:
        description: 'CARE API Token (baked into EXE)'
        required: false
        default: ''
        type: string
      care_modality:
        description: 'DICOM Modality Filter (baked into EXE)'
        required: false
        default: ''
        type: string
      care_from_date:
        description: 'Worklist From Date (baked into EXE)'
        required: false
        default: ''
        type: string
      care_backend:
        description: 'Backend Mode (0=List, 1=Database, 2=CARE Server)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '0'
          - '1'
          - '2'

jobs:
  build:
    runs-on: windows-latest

    # Resolve CARE settings once: manual input wins, then repository secret/var.
    # Reading these through env (rather than inline ${{ }} in the script) keeps
    # GitHub's secret masking intact and avoids shell injection.
    env:
      # Sensitive -> Secrets (masked in logs)
      CARE_BASE_URL:  ${{ inputs.care_server_url != '' && inputs.care_server_url || secrets.CARE_BASE_URL }}
      CARE_API_TOKEN: ${{ inputs.care_api_token  != '' && inputs.care_api_token  || secrets.CARE_API_TOKEN }}
      # Non-sensitive -> Variables. These end up in the artifact filename, and a
      # masked secret would render there as "***", so they must not be secrets.
      CARE_MODALITY:  ${{ inputs.care_modality   != '' && inputs.care_modality   || vars.CARE_MODALITY }}
      CARE_FROM_DATE: ${{ inputs.care_from_date  != '' && inputs.care_from_date  || vars.CARE_FROM_DATE }}
      CARE_BACKEND:   ${{ inputs.care_backend    != '' && inputs.care_backend    || vars.CARE_BACKEND }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two services talk to CARE, through DIFFERENTLY NAMED keys in separate
      # config files. Patching only the MWL service leaves image upload and the
      # study webhook pointing at whatever is committed, which is the shared
      # staging server:
      #
      #   CARE_MWL_Service  careBaseUrl    -> worklist C-FIND, MPPS webhook
      #                     careToken
      #   CARE_SCU_Service  careBackendURL -> DICOM upload, study webhook
      #                     staticAPIKey
      #
      # The root App.config (CARE_DICOM_Enabler.exe.config) carries a stale
      # copy of the SCU keys that no code reads; it is patched too so the
      # archive does not ship the staging URL and token in a third place.
      - name: Patch CARE settings into all service App.config files
        shell: pwsh
        run: |
          $serverUrl = "$env:CARE_BASE_URL"
          $apiToken  = "$env:CARE_API_TOKEN"
          $modality  = "$env:CARE_MODALITY"
          $fromDate  = "$env:CARE_FROM_DATE"
          $backend   = "$env:CARE_BACKEND"

          if (-not ($serverUrl -or $apiToken -or $modality -or $fromDate -or $backend)) {
            Write-Output "No CARE settings supplied - keeping App.config defaults."
            exit 0
          }

          # Keys whose values are credentials: log a length, never the value.
          $secretKeys = @('careToken', 'staticAPIKey', 'jwtToken')

          function Update-ConfigFile([string]$path, [hashtable]$settings) {
            if (-not (Test-Path $path)) {
              Write-Warning "$path not found - skipped"
              return
            }

            [xml]$xml = Get-Content $path
            $adds = $xml.configuration.appSettings.add
            Write-Output "Patching $path"
            $applied = 0

            foreach ($key in $settings.Keys) {
              $value = $settings[$key]
              if ([string]::IsNullOrEmpty($value)) { continue }

              $node = $adds | Where-Object key -eq $key
              if ($null -eq $node) {
                Write-Warning "  key '$key' absent from $path - skipped"
                continue
              }

              $node.value = $value
              $applied++

              if ($secretKeys -contains $key) {
                Write-Output "  - $key = (set, $($value.Length) chars)"
              } else {
                Write-Output "  - $key = $value"
              }
            }

            if ($applied -gt 0) {
              $xml.Save((Resolve-Path $path).Path)
              Write-Output "  saved ($applied setting(s))"
            } else {
              Write-Output "  nothing to change"
            }
          }

          # Worklist + MPPS webhook
          Update-ConfigFile "CARE_MWL_Service\App.config" @{
            backend      = $backend
            careBaseUrl  = $serverUrl
            careToken    = $apiToken
            careModality = $modality
            careFromDate = $fromDate
          }

          # DICOM upload + study webhook
          Update-ConfigFile "CARE_SCU_Service\App.config" @{
            careBackendURL = $serverUrl
            staticAPIKey   = $apiToken
          }

          # Stale duplicates shipped in CARE_DICOM_Enabler.exe.config. The
          # WinForms UI reads cfg\common.cfg via cls_PlexusConfig, never its own
          # .exe.config, so nothing consumes these - they are rewritten only so
          # the archive stops shipping the staging URL in a third place.
          $authUrl = if ($serverUrl) { "$($serverUrl.TrimEnd('/'))/api/token/" } else { '' }
          Update-ConfigFile "App.config" @{
            careBackendURL = $serverUrl
            staticAPIKey   = $apiToken
            authURL        = $authUrl
          }

          Write-Output ""
          Write-Output "All CARE settings baked in - every service now targets the same server."

          # A wrong token is invisible until a modality issues a C-FIND and the
          # worklist comes back empty, because the .NET client swallows the HTTP
          # error. Print a fingerprint so the operator can compare it against the
          # server's CARE_RADIOLOGY_WEBHOOK_SECRET without either side echoing the
          # secret:  echo -n "$SECRET" | sha256sum
          if ($apiToken) {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            $hash = [BitConverter]::ToString(
              $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($apiToken))
            ).Replace('-', '').ToLower()
            Write-Output "Token fingerprint (sha256, first 16): $($hash.Substring(0, 16))"
          }

      # A token that does not authenticate produces no build error and no runtime
      # error - just a permanently empty worklist - so reject it here instead.
      # Builds targeting a server the runner cannot reach (a hospital LAN address)
      # only warn: unreachable is not the same as unauthorized.
      - name: Verify CARE API token authenticates against the server
        if: env.CARE_BASE_URL != '' && env.CARE_API_TOKEN != ''
        shell: pwsh
        run: |
          $serverUrl = "$env:CARE_BASE_URL".TrimEnd('/')
          $apiToken  = "$env:CARE_API_TOKEN"

          # Authentication runs before any filtering, so the cheapest possible
          # query proves the token: an empty [now, now] window matches no service
          # request, leaving only the status code to inspect. from/to are the
          # endpoint's own filter parameters and have no bearing on what gets
          # baked into the build - careFromDate above is what ships.
          $instant  = (Get-Date).ToString('yyyy-MM-dd HH:mm:ss')
          $window   = [Uri]::EscapeDataString($instant)
          $probeUrl = "$serverUrl/api/care_radiology/dicom/worklist/?modality=&from=$window&to=$window"

          Write-Output "Probing $serverUrl/api/care_radiology/dicom/worklist/ ..."

          try {
            # SkipHeaderValidation: the plugin expects the raw secret as the whole
            # Authorization value, which .NET's header parser rejects if it contains
            # characters no auth scheme would. Send it as-is and judge by status code.
            $response = Invoke-WebRequest -Uri $probeUrl -Method Get -TimeoutSec 20 `
                          -Headers @{ Authorization = $apiToken } `
                          -SkipHttpErrorCheck -SkipHeaderValidation
          } catch {
            Write-Warning "Could not reach $serverUrl ($($_.Exception.Message))."
            Write-Warning "Token NOT verified. If this server is on a private network this is expected;"
            Write-Warning "otherwise check CARE_BASE_URL."
            exit 0
          }

          $code = [int]$response.StatusCode

          if ($code -eq 401 -or $code -eq 403) {
            Write-Output "::error::CARE API token rejected by $serverUrl (HTTP $code)."
            Write-Output "::error::The token baked into this build does not match the server's"
            Write-Output "::error::PLUGIN_CONFIGS['care_radiology']['CARE_RADIOLOGY_WEBHOOK_SECRET']."
            Write-Output "::error::Fix the CARE_API_TOKEN repository secret (or the care_api_token input)"
            Write-Output "::error::and re-run. Compare the fingerprint above with the server's:"
            Write-Output "::error::  echo -n `"`$CARE_RADIOLOGY_WEBHOOK_SECRET`" | sha256sum"
            exit 1
          }

          if ($code -eq 404) {
            Write-Warning "HTTP 404 - the radiology plugin may not be installed on $serverUrl. Token NOT verified."
            exit 0
          }

          if ($code -ne 200) {
            Write-Warning "Unexpected HTTP $code from the worklist endpoint. Token NOT verified."
            exit 0
          }

          Write-Output "Token accepted (HTTP 200)."

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CARE_DICOM_Enabler.sln

      - name: Display Build Configuration
        shell: pwsh
        run: |
          $config    = "${{ inputs.build_configuration || 'Release' }}"
          $platform  = "${{ inputs.build_platform || 'Any CPU' }}"
          $parallel  = "${{ inputs.parallel_build }}"
          $artifact  = "${{ inputs.upload_artifact }}"
          $serverUrl = "$env:CARE_BASE_URL"
          $modality  = "$env:CARE_MODALITY"
          $backend   = "$env:CARE_BACKEND"

          Write-Output "Build Configuration:"
          Write-Output "  - Configuration: $config"
          Write-Output "  - Platform: $platform"
          Write-Output "  - Parallel Build: $(if ($parallel -eq 'true' -or $parallel -eq '') { 'Enabled' } else { 'Disabled' })"
          Write-Output "  - Upload Artifact: $(if ($artifact -eq 'true' -or $artifact -eq '') { 'Yes' } else { 'No' })"

          if ($serverUrl -ne '' -or $modality -ne '' -or $backend -ne '') {
            Write-Output ""
            Write-Output "CARE Server Settings (baked into EXE):"
            if ($backend -ne '') {
              Write-Output "  - Backend Mode: $backend"
            }
            if ($serverUrl -ne '') {
              Write-Output "  - Server URL: $serverUrl"
            }
            if ($modality -ne '') {
              Write-Output "  - Modality: $modality"
            }
          } else {
            Write-Output ""
            Write-Output "CARE Server Settings: Using defaults from App.config"
          }

      - name: Build Solution
        shell: pwsh
        run: |
          $config   = "${{ inputs.build_configuration || 'Release' }}"
          $platform = "${{ inputs.build_platform || 'Any CPU' }}"
          $parallel = "${{ inputs.parallel_build }}"

          # Build command
          $cmd = "msbuild CARE_DICOM_Enabler.sln /p:Configuration=$config /p:Platform=`"$platform`""

          # Add parallel flag if enabled (default true for push/PR, configurable for manual)
          if ($parallel -eq 'true' -or $parallel -eq '') {
            $cmd += " /m"
          }

          Write-Output "Executing: $cmd"
          Invoke-Expression $cmd

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Copy cfg and create logs dir
        shell: pwsh
        run: |
          $config = "${{ inputs.build_configuration || 'Release' }}"
          $binPath = "bin\$config"

          Write-Output "Setting up configuration for $config build..."
          New-Item -ItemType Directory -Force -Path "$binPath\cfg"
          Copy-Item cfg\common.cfg "$binPath\cfg\common.cfg"
          New-Item -ItemType Directory -Force -Path "$binPath\logs"
          Write-Output "Configuration files and directories created in $binPath"

          # common.cfg is read by CARE.Common (cls_PlexusConfig), not by
          # ConfigurationManager, so the App.config patching above never touches
          # it. Its authURL is what CARE_Auth_Service authenticates the app user
          # against (PlexusAuthService.cs:234 -> WebRequest.Create at :139), and
          # a failure there stops the DICOM services - so it must not be left
          # pointing at the shared staging server.
          #
          # connectString / uname / pwd are deliberately NOT rewritten: they are
          # AES-encrypted and the workflow holds no plaintext to re-encrypt.
          # Regenerate them locally with the GenerateConnectionString project -
          # see LOCAL_TESTING.md section 4.3.
          if ($env:CARE_BASE_URL) {
            $cfgPath = "$binPath\cfg\common.cfg"
            [xml]$cfg = Get-Content $cfgPath
            $node = $cfg.SelectSingleNode('/configurations/authURL')
            if ($node) {
              $node.InnerText = "$($env:CARE_BASE_URL.TrimEnd('/'))/api/token/"
              $cfg.Save((Resolve-Path $cfgPath).Path)
              Write-Output "  - cfg\common.cfg authURL = $($node.InnerText)"
            } else {
              Write-Warning "  authURL element absent from common.cfg - skipped"
            }
          }

      - name: Copy Emulator initializer scripts
        shell: pwsh
        run: |
          $config  = "${{ inputs.build_configuration || 'Release' }}"
          $binPath = "bin\$config"

          New-Item -ItemType Directory -Force -Path "$binPath\Emulator" | Out-Null

          # Copy whatever the Emulator folder actually contains. Naming the
          # individual initializer files here would fail the whole build when
          # one is absent, because Actions runs pwsh with
          # $ErrorActionPreference = 'stop'.
          $src = Get-ChildItem -Path "Emulator" -File -ErrorAction SilentlyContinue
          if (-not $src) {
            Write-Warning "Emulator folder is empty or missing - nothing to copy"
          } else {
            foreach ($f in $src) {
              Copy-Item $f.FullName "$binPath\Emulator\$($f.Name)" -Force
              Write-Output "Copied: Emulator\$($f.Name) ($([math]::Round($f.Length / 1KB)) KB)"
            }
          }

          # Flag the initializer scripts as absent rather than failing: they are
          # not in the repository yet, only Modality-Emulator-*.zip is.
          foreach ($want in @("Initializer.bat", "Initializer.ps1", "schema.sql")) {
            if (-not (Test-Path "$binPath\Emulator\$want")) {
              Write-Warning "Emulator\$want not found in the repository - skipped"
            }
          }

      - name: Set short SHA and artifact suffix
        shell: pwsh
        run: |
          echo "SHORT_SHA=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_ENV

          # Add suffix if CARE settings are customized
          $serverUrl = "$env:CARE_BASE_URL"
          $modality  = "$env:CARE_MODALITY"
          $backend   = "$env:CARE_BACKEND"

          if ($serverUrl -ne '' -or $modality -ne '' -or $backend -ne '') {
            $suffix = "-custom"
            if ($modality -ne '') {
              $suffix += "-$modality"
            }
            if ($backend -eq '2') {
              $suffix += "-CARE"
            } elseif ($backend -eq '1') {
              $suffix += "-DB"
            } elseif ($backend -eq '0') {
              $suffix += "-List"
            }
            echo "ARTIFACT_SUFFIX=$suffix" >> $env:GITHUB_ENV
          } else {
            echo "ARTIFACT_SUFFIX=" >> $env:GITHUB_ENV
          }

      - name: Upload Build Artifact
        if: ${{ inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: CARE_DICOM_Enabler-${{ inputs.build_configuration || 'Release' }}-${{ inputs.build_platform || 'AnyCPU' }}${{ env.ARTIFACT_SUFFIX }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_number }}-${{ env.SHORT_SHA }}
          path: bin\${{ inputs.build_configuration || 'Release' }}\
          if-no-files-found: error
